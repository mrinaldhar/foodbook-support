<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Foodbook kitchen</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f5f5f7; color: #1c1c1e; display: grid; place-items: center; min-height: 100vh; }
    main { background: white; max-width: 420px; margin: 24px; padding: 32px 24px;
           border-radius: 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    .icon { width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
            background: #fff1e5; display: grid; place-items: center; font-size: 38px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #6e6e73; margin: 0 0 20px; }
    a.button { display: block; background: #ff7a1a; color: white; text-decoration: none;
               font-weight: 600; padding: 15px 20px; border-radius: 14px; margin: 20px 0 12px; }
    code { font-size: 13px; color: #6e6e73; word-break: break-all; }
    .note { font-size: 14px; margin-top: 22px; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f5f5f7; }
      main { background: #1c1c1e; }
      p, code { color: #a1a1a6; }
    }
  </style>
</head>
<body>
<main>
  <div class="icon">🍳</div>
  <h1>Join a Foodbook kitchen</h1>
  <p>Someone shared their kitchen with you. Open Foodbook to see the invite and join.</p>
  <a class="button" id="open" href="foodbook://invite">Open Foodbook</a>
  <p class="note">If the button does nothing, install the latest TestFlight build first, then try again.</p>
  <code id="code"></code>
</main>
<script>
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    const link = document.getElementById("open");
    link.href = "foodbook://invite?code=" + encodeURIComponent(code);
    document.getElementById("code").textContent = "Invite code: " + code;
  }
</script>
</body>
</html>
